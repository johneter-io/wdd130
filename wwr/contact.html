<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Golden Rafting</title>
    <meta name="description"
      content="Please contact us. The Golding Rafting is made for your well-being.">
    <meta name="author" content="John Peter Joseph">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="flex-container">
            <img src="images/canoe.png" alt="rafting logo">
            <div class="navhead">
                <nav>
                    <a href="index.html">Home</a>
                    <a href="about.html">About Us</a>
                    <a href="trips.html">Trips</a>
                    <a href="contact.html">Contact Us</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <h1 class="while-water">While Water Rafting Company</h1>
        <div class="main-river">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="grid-container">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13339124.54842494!2d-129.90854096975247!3d36.81289294078944!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sCalifornia%2C%20USA!5e1!3m2!1sen!2sht!4v1775510023526!5m2!1sen!2sht"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <fieldset>
                    <div class="yourname">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="placeholder"
                          required>
                    </div>

                    <div class="username">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="placeholder"
                          required>
                    </div>
                </fieldset>

                <fieldset>
                    <div class="select">
                        <label>Message purpose</label>
                        <div class="radio-group">
                            <div>
                                <input type="radio" name="purpose" id="general">
                                <label for="general">General inquiry</label>
                            </div>
                            <div>
                                <input type="radio" name="purpose" id="reservation">
                                <label for="reservation">Reservation Question</label>
                            </div>

                            <div>
                                <input type="radio" name="purpose" id="website">
                                <label for="website">Website Suggestion</label>
                            </div>
                        </div>
                    </div>

                    <div class="comment">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" rows="4"></textarea>
                    </div>

                    <div class="box">
                        <label for="check">Please subscribe me to the monthly
                            newsletter</label>
                        <input type="checkbox" id="check">
                    </div>

                    <button type="submit">Get in Touch!</button>
                </fieldset>
        </div>
        </form>
        </div>

        <div class="promotion2">
            <h3>We Are Here to Serve You</h3>
            <div class="promotion2-content">
                <figure>
                    <img src="images/alexandra-millard.jpg" alt="Alexnadra Millard" width="130">
                    <figcaption>Alexandra Millard</figcaption>
                </figure>
                <figure>
                    <img src="images/david-burke.jpg" alt="David Burke" width="130">
                    <figcaption>David Burke</figcaption>
                </figure>
                <figure>
                    <img src="images/marie-jose.jpg" alt="Marie Jose" width="130">
                    <figcaption>Marie Jose</figcaption>
                </figure>
                </di>
            </div>
    </main>
    <footer>
        <div class="credit">
            <p>©️ 2026 | The Golden Rafting | John Peter Joseph</p>
            <nav class="socialmedia">
                <a href="https://youtube.com">
                    <img src="images/social-media/youtube.png" alt="YouTube home">
                </a>
                <a href="https://instagram.com">
                    <img src="images/social-media/instagram.png" alt="instagram home">
                </a>
                <a href="https://facebook.com">
                    <img src="images/social-media/facebook.png" alt="Facebook home">
                </a>
            </nav>
        </div>
    </footer>

</html>
