    <main>
        <div class="trips-page">
            <img src="images/trips/main-trips.jpg" alt="rafting adventure">
            <p>Do not just watch the river, command it. Dive into an adrenaline fueled journey
                where the pulse ofthe water meets the thrill of the unknown.</p>
        </div>

        <section>
            <div class="trip-container">
                <div>
                    <figure>
                        <h1 class="trip-program">Discovery</h1>
                        <h2>Family and Children</h2>
                        <img src="images/trips/trips-rafting-4.jpg" alt="The most fun rafting"
                          width="200">
                        <p><b>"Enjoy an unforgettable family experience!"</b></p>
                        <p class="paragraph">This excursion has been
                            specially designed for parents
                            and children who want to discover the joys of the river in complete
                            safety. Between fun little
                            rapids, <span>you will have plenty of time to admire the scenery and
                                even
                                take a
                                dip in the calm areas.</span> A
                            gentle introduction to create your first rafting memories.</p>
                    </figure>
                </div>

                <div>
                    <figure>
                        <h1 class="trip-program">Adventure</h1>
                        <h2>Sports and Fun</h2>
                        <img src="images/trips/trips-rafting-8.jpg" alt="The most fun rafting"
                          width="200">
                        <p><b>"Get ready for an adrenaline rush and lots of laughs!"</b></p>
                        <p class="paragraph">Looking for a thrill? This trip is our
                            all-time favorite. <span>On the agenda: waves, splashes, and rapids that
                                will
                                get your heart racing.</span> It's the perfect choice for a group
                            of
                            friends or
                            an energetic outing where
                            teamwork is key to steering
                            the boat!</p>
                    </figure>
                </div>

                <div>
                    <figure>
                        <h1 class="trip-program">Complete Collection</h1>
                        <h2>Expert and Adrenaline</h2>
                        <img src="images/trips/trips-rafting-3.jpg" alt="The most fun rafting"
                          width="200">
                        <p><b>"Push your limits on the whitewater!"</b></p>
                        <p class="paragraph">Calling all thrill-seekers!
                            This is no joke: <span>the river gets technical and powerful.</span>
                            Accompanied by our most experienced
                            guides, you'll tackle the canyon's most
                            impressive rapids. An intense, athletic experience reserved for those
                            who aren't afraid to dive
                            right into the heart of the action.</p>
                    </figure>
                </div>

                <div>
                    <figure>
                        <h1 class="trip-program">Expedition</h1>
                        <h2>Nature and Wilderness</h2>
                        <img src="images/trips/trips-rafting-7.jpg" alt="The most fun rafting"
                          width="200">
                        <p><b>"Connect with the wild heart of the Andes!"</b></p>
                        <p class="paragraph">For those who seek more than just thrills,
                            this journey takes you deep into untouched territories.
                            <span>Observe local wildlife and hidden waterfalls</span> that
                            are
                            only accessible by water. This full-day immersive
                            experience includes a riverside organic lunch and
                            moments of pure tranquility between exciting
                            river crossings. The perfect escape for nature lovers.
                        </p>
                    </figure>
                </div>
            </div>
            </div>
        </section>


        <div class="image-main">
            <figure>
